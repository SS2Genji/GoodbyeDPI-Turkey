name: Build & Package GoodbyeDPI-Turkey

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDIVERT_URL: https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
  WINDIVERT_NAME: WinDivert-2.2.2-A.zip
  WINDIVERT_BASENAME: WinDivert-2.2.2-A

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Native Sanitizer & Micro-Benchmark Suite
        run: |
          make -C src test SANITIZE=1
          make -C src test OPTIMIZE=1

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-mingw-w64 zip unzip wget

      - name: Download & Unpack WinDivert 2.2.2-A
        run: |
          wget -q "${{ env.WINDIVERT_URL }}" -O "${{ env.WINDIVERT_NAME }}"
          unzip -q -o "${{ env.WINDIVERT_NAME }}"

      - name: Compile Windows x86_64 (SSE4.2 / LTO / O3)
        run: |
          cd src && make clean
          make CPREFIX=x86_64-w64-mingw32- BIT64=1 OPTIMIZE=1 WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x64 -j4
          mkdir -p ../windows/x86_64
          cp goodbyedpi.exe ../windows/x86_64/
          cp ../${{ env.WINDIVERT_BASENAME }}/x64/WinDivert.dll ../${{ env.WINDIVERT_BASENAME }}/x64/WinDivert64.sys ../windows/x86_64/

      - name: Compile Windows x86 (SSE4.2 / LTO / O3)
        run: |
          cd src && make clean
          make CPREFIX=i686-w64-mingw32- OPTIMIZE=1 WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x86 -j4
          mkdir -p ../windows/x86
          cp goodbyedpi.exe ../windows/x86/
          cp ../${{ env.WINDIVERT_BASENAME }}/x86/WinDivert.dll ../${{ env.WINDIVERT_BASENAME }}/x86/WinDivert32.sys ../${{ env.WINDIVERT_BASENAME }}/x86/WinDivert64.sys ../windows/x86/

      - name: Package Ready-to-Run Windows Release Archive
        run: |
          cd windows
          zip -r -9 ../GoodbyeDPI-Turkey-Optimized.zip .

      - name: Upload Release Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-Turkey-Optimized
          path: GoodbyeDPI-Turkey-Optimized.zip

      - name: Commit Compiled Binaries & Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f windows/x86_64/goodbyedpi.exe windows/x86/goodbyedpi.exe windows/x86_64/*.dll windows/x86_64/*.sys windows/x86/*.dll windows/x86/*.sys
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update compiled Windows x86_64 and x86 binaries [skip ci]"
            git push
          fi
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release delete v2.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v2.0.0 GoodbyeDPI-Turkey-Optimized.zip \
            --title "GoodbyeDPI-Turkey (TurkDPI Engine v2.0.0 — Clean-Sheet Discord & ISP Desync)" \
            --notes "Zero-dependency clean-sheet C/SIMD DPI circumvention engine for Turkey (Zapret RFC 2385 TCP MD5Sig + ByeDPI 3-Way SNI-Midpoint Split/Disorder + Discord Voice/WebRTC UDP Desync + Dual-Stack DNS Shield + In-Process TLS 1.3 ISP Auto-Probe)."
