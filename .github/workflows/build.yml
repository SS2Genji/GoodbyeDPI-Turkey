name: Build & Package GoodbyeDPI-Turkey

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDIVERT_URL: https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
  WINDIVERT_NAME: WinDivert-2.2.2-A.zip
  WINDIVERT_BASENAME: WinDivert-2.2.2-A

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Native Sanitizer & Micro-Benchmark Suite
        run: |
          make -C src test SANITIZE=1
          make -C src test OPTIMIZE=1

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-mingw-w64 zip unzip wget

      - name: Download & Unpack WinDivert 2.2.2-A
        run: |
          wget -q "${{ env.WINDIVERT_URL }}" -O "${{ env.WINDIVERT_NAME }}"
          unzip -q -o "${{ env.WINDIVERT_NAME }}"

      - name: Compile Windows x86_64 Native System Tray Binary (SSE4.2 / LTO / O3)
        run: |
          cd src && make clean
          make CPREFIX=x86_64-w64-mingw32- BIT64=1 OPTIMIZE=1 WINDIVERTHEADERS=../${{ env.WINDIVERT_BASENAME }}/include WINDIVERTLIBS=../${{ env.WINDIVERT_BASENAME }}/x64 -j4
          mkdir -p ../windows
          cp goodbyedpi.exe ../windows/
          cp ../${{ env.WINDIVERT_BASENAME }}/x64/WinDivert.dll ../${{ env.WINDIVERT_BASENAME }}/x64/WinDivert64.sys ../windows/

      - name: Package Ready-to-Run Windows Release Archive
        run: |
          cd windows
          zip -r -9 ../GoodbyeDPI-Turkey-Optimized.zip .

      - name: Upload Release Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-Turkey-Optimized
          path: GoodbyeDPI-Turkey-Optimized.zip

      - name: Commit Compiled Binary & Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f windows/goodbyedpi.exe windows/WinDivert.dll windows/WinDivert64.sys
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update compiled Windows System Tray binary [skip ci]"
            git push
          fi
          gh release delete v2.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release delete v2.1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v2.1.0 GoodbyeDPI-Turkey-Optimized.zip \
            --title "GoodbyeDPI-Turkey (TurkDPI v2.1.0 — System Tray Edition)" \
            --notes "Pure Win32 System Tray DPI & Discord Voice/TLS desync engine (zero console window, zero .cmd scripts; right-click tray icon to switch Turkish ISP profiles, auto-probe, test Discord, or enable Windows startup)."
